plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kevin.moneyboard'
    compileSdk 35

    signingConfigs {
        stableDebug {
            storeFile file('moneyboard-debug.keystore')
            storePassword 'moneyboard123'
            keyAlias 'moneyboard'
            keyPassword 'moneyboard123'
        }
    }

    defaultConfig {
        applicationId 'com.kevin.moneyboard'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.3.1'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableDebug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
